name: steward

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steward}
      POSTGRES_DB: ${POSTGRES_DB:-steward}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steward} -d ${POSTGRES_DB:-steward}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-steward}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-steward}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.54.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:-steward}@postgres:5432/${POSTGRES_DB:-steward}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      PORT: "4000"
      RUN_MIGRATIONS_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - artifacts:/data/artifacts

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:-steward}@postgres:5432/${POSTGRES_DB:-steward}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      API_INTERNAL_URL: http://api:4000
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - artifacts:/data/artifacts
      # Sandbox containers are created through the Docker socket. Use a dedicated
      # Docker host (SANDBOX_DOCKER_HOST) in production instead of the control-plane daemon.
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    profiles: ["app"]
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: "3000"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  artifacts:
