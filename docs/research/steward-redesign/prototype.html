<script>

function icon(name,size=17){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.file}"/></svg>`}

const logo=`<a class="logo" href="#overview" aria-label="Steward prototype home">${mark}steward</a>`;
const navItems=[['overview','home','Overview'],['approvals','inbox','Approvals'],['work','work','Work'],['agents','agents','Team'],['knowledge','book','Knowledge'],['tools','tools','Tools']];

let route='overview',toastTimer;
function badge(text,tone='green'){return `<span class="badge ${tone}"><span class="dot"></span>${text}</span>`}
function button(text,to,kind=''){return `<button class="btn ${kind}" data-route="${to}">${text}${icon('arrow',14)}</button>`}

tton data-action="menu">${icon('menu',19)}More</button></nav>`}
function heading(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function workRow(title,sub,status,tone='green'){return `<button class="work-row" data-route="run"><span class="state-icon ${tone==='blue'?'running':''}">${icon(tone==='blue'?'clock':'check',13)}</span><span class="grow"><span class="work-title" style="display:block">${title}</span><span class="work-sub">${sub}</span></span>${badge(status,tone)}</button>`}
function overview(){return `${heading('Room to think.','Your team is moving the work forward. Here’s what needs you.',`<button class="btn primary" data-route="new">${icon('plus',14)}Delegate work</button>`)}<div class="overview-grid"><div><section><div class="section-head"><h2>Needs your decision <span class="muted small">${state.approval==='pending'?'· 1':''}</span></h2><button class="text-link" data-route="approvals">View approvals ${icon('arrow',13)}</button></div>${state.approval==='pending'?`<article class="decision"><div class="row between">${badge('Approval requested','amber')}<span class="small muted">4 min ago</span></div><h3>Send the pilot invitation?</h3><p>Growth prepared an invitation for a prospective pilot team. Review the exact email before anything leaves your workspace.</p><div class="decision-actions">${button('Review invitation','approvals','primary')}<button class="btn ghost" data-route="run">View run</button></div><div class="decision-meta"><span class="avatar">GR</span><span>Growth agent</span><span>·</span><span>External email · 1 recipient</span></div></article>`:`<div class="callout">${icon('check',20)}<div><h2>No decisions waiting.</h2><p>The invitation was ${state.approval==='approved'?'approved for this example':'declined in this example'}. Your team can keep working.</p></div></div>`}</section><section class="work-section"><div class="section-head"><h2>Work in motion</h2><button class="text-link" data-route="work">All work ${icon('arrow',13)}</button></div>${workRow('Research the next pilot cohort','Research · Comparing workflow needs',state.run==='running'?'In progress':'Cancelled',state.run==='running'?'blue':'red')}${workRow('Draft a founder onboarding guide','Operations · Guide ready to review','Ready','green')}${workRow('Check the weekly AI spend','Finance · Within the example budget','Complete','green')}${state.newTask?workRow('Your new delegated task','Chief of Staff · Local example only','Queued','blue'):''}</section><div class="brief"><span class="agent-avatar">${icon('agents',16)}</span><p><strong>From your Chief of Staff</strong><br>The onboarding guide is ready. I’m comparing pilot workflows next, and the invitation is waiting for your review. No external actions have been taken.</p></div></div><aside class="overview-aside"><section class="aside-section"><h2>AI spend this month</h2><div class="budget-line num"><strong>$4.82</strong><span class="small muted">of $25.00 limit</span></div><div class="meter" role="meter" aria-label="Example monthly AI budget used" aria-valuenow="4.82" aria-valuemin="0" aria-valuemax="25"><span></span></div><div class="row between small muted"><span>Provider usage · Example</span><button class="text-link" data-route="settings">Manage ${icon('arrow',12)}</button></div></section><section class="aside-section"><div class="section-head"><h2 style="margin:0">Your team</h2><button class="text-link" data-route="agents">View team</button></div><div class="team-list">${teamLine('Chief of Staff','Coordinating work','agents','')}${teamLine('Research','Researching pilot needs','search','blue')}${teamLine('Growth','Waiting for approval','mail','amber')}</div></section><section><h2 style="font-size:13px;margin-bottom:12px">You set the boundaries.</h2><p class="small muted" style="font-size:11px;line-height:1.9">Your team works within your budget and asks before taking external actions.</p><button class="text-link" data-route="settings" style="margin-top:8px">Review autonomy settings ${icon('arrow',12)}</button></section></aside></div>`}

function approvals(){return `${heading('Your judgment. Their next step.','Review the action, its scope, and the evidence before you decide.')}<div class="tabs"><button class="tab active" data-route="approvals">${state.approval==='pending'?'Pending (1)':'Decision recorded'}</button><button class="tab" data-action="reset-approval">Reset example</button></div>${state.approval==='pending'?`<div class="detail-grid"><article><div class="row wrap" style="margin-bottom:16px">${badge('External action','amber')}<span class="small muted">Requested by Growth agent · 4 min ago</span></div><h2 style="font-size:24px;margin-bottom:22px">Send the pilot invitation</h2><div class="notice">Approving authorizes this one email to this recipient. It does not change your team's standing permissions.</div><section class="detail-section" style="margin-top:24px"><h2>What will be sent</h2><div class="preview prose"><p class="small"><strong>To</strong> &nbsp; alex@example.com<br><strong>Subject</strong> &nbsp; Your Steward assisted pilot</p><p>Hi Alex,</p><p>We’d like to invite your team to the Steward assisted pilot. We’ll help you set up one workspace and configure your first workflow.</p><p>The pilot is $49 USD, paid once. Bring your own model key; your provider bills usage separately. Payment does not create your account.</p><p>Reply if you’d like to arrange onboarding.<br>The Steward team</p></div></section><section class="detail-section"><h2>Why approval is needed</h2><p class="prose">This sends a message outside your company. Your supervised autonomy settings require review before external communication.</p></section></article><aside class="detail-aside"><section><h2 style="font-size:13px;margin-bottom:22px">Action details</h2><dl class="details-list"><div><dt>Action</dt><dd>Send an external email</dd></div><div><dt>Scope</dt><dd>One recipient · One message</dd></div><div><dt>Recipient</dt><dd>alex@example.com (fictional)</dd></div><div><dt>Requested by</dt><dd>Growth agent</dd></div><div><dt>AI cost so far</dt><dd>$0.24 · Recorded example</dd></div><div><dt>Reversibility</dt><dd>Sent email cannot be recalled</dd></div></dl></section><section><h2 style="font-size:13px;margin-bottom:15px">Supporting work</h2><button class="artifact" data-route="run">${icon('file',20)}<span class="grow"><strong class="small">Pilot outreach run</strong><br><span class="small muted" style="font-size:11px">Plan, sources and draft</span></span>${icon('arrow',14)}</button></section></aside><footer class="approval-actions"><div class="decision-actions"><button class="btn primary" data-action="approve">${icon('check',15)}Approve this email</button><button class="btn danger" data-action="decline">Decline</button></div><p class="small muted" style="font-size:11px;margin-top:14px">Prototype only. No email is sent and no permission changes.</p></footer></div>`:`<div class="blank"><span class="agent-avatar" style="margin:0 auto 17px">${icon('check',18)}</span><h2>${state.approval==='approved'?'Decision recorded.':'Invitation declined.'}</h2><p>${state.approval==='approved'?'The example email is approved. In production, the run resumes only after the server records your decision.':'The example email will not be sent. In production, the run follows its decline path.'}<br>No real email was sent by this prototype.</p>${button('Back to overview','overview','primary')}</div>`}`}
function work(){return `${heading('Good work, in one place.','Goals become tasks. Tasks leave a record.',`<button class="btn primary" data-route="new">${icon('plus',14)}Delegate work</button>`)}<div class="tabs">${['Active','Completed','All'].map(t=>`<button class="tab ${state.workTab===t?'active':''}" data-work-tab="${t}">${t}</button>`).join('')}</div>${state.workTab!=='Completed'?workRow('Research the next pilot cohort','Research agent · Pilot research',state.run==='running'?'In progress':'Cancelled',state.run==='running'?'blue':'red'):''}${state.workTab!=='Active'?workRow('Check the weekly AI spend','Finance agent · Usage review','Complete'):''}${state.workTab!=='Completed'?workRow('Draft a founder onboarding guide','Operations agent · Onboarding','Ready to review'):''}${state.newTask&&state.workTab!=='Completed'?workRow('Your new delegated task','Chief of Staff · Local example only','Queued','blue'):''}<div class="notice green" style="margin-top:25px">This is a focused task-list concept. Boards, projects, workflows and the run archive remain accessible from Work in the implementation plan.</div>`}
function run(){return `${heading('Research the next pilot cohort','A clear record of what happened, what it cost, and what comes next.',`<button class="btn ${state.run==='running'?'danger':''}" data-action="${state.run==='running'?'cancel-run':'reset-run'}">${icon(state.run==='running'?'stop':'refresh',13)}${state.run==='running'?'Cancel run':'Reset example'}</button>`)}<div class="row wrap" style="margin-bottom:28px">${badge(state.run==='running'?'In progress':'Cancelled',state.run==='running'?'blue':'red')}<span class="small muted">Research agent · Started 8 minutes ago</span></div><div class="detail-grid"><article><section class="detail-section"><h2>Outcome</h2><p class="prose">Compare the workflow needs of prospective pilot teams and prepare a short recommendation. <strong>Do not contact anyone.</strong></p></section><section class="detail-section"><h2>Run timeline</h2><ol class="timeline"><li><span class="state-icon">${icon('check',12)}</span><div><h3>Plan created</h3><p>Compare sources, summarize needs, prepare a shortlist.</p></div><time>10:42</time></li><li><span class="state-icon">${icon('check',12)}</span><div><h3>Workspace context read</h3><p>Pilot scope and onboarding notes · 2 documents</p></div><time>10:43</time></li><li><span class="state-icon">${icon('check',12)}</span><div><h3>Research brief drafted</h3><p>Three workflow categories identified from the example notes.</p></div><time>10:46</time></li><li><span class="state-icon running">${icon(state.run==='running'?'clock':'stop',12)}</span><div><h3>${state.run==='running'?'Comparing workflow needs':'Cancelled by you'}</h3><p>${state.run==='running'?'Next: verify findings and prepare a recommendation.':'No further example steps will run. Completed steps remain recorded.'}</p></div><time>${state.run==='running'?'Now':'10:50'}</time></li></ol></section><section class="detail-section"><h2>Work product</h2><button class="artifact" data-action="artifact">${icon('file',22)}<span class="grow"><strong class="small">Pilot workflow research</strong><br><span class="small muted" style="font-size:11px">Draft brief · Example artifact</span></span>${icon('arrow',15)}</button><div id="artifact-preview" class="preview prose" style="margin-top:16px" ${state.draft?'':'hidden'}><h3>Pilot workflow research</h3><p>Example finding: start with a bounded research workflow that produces a reviewable brief, then add external actions only after the founder reviews the result.</p><p>Source: fictional workspace onboarding notes. This is not customer research.</p></div></section><details class="detail-section"><summary style="font-size:12px;cursor:pointer">Technical record · Model and tool calls</summary><p class="prose" style="margin-top:15px">Illustrative event: read workspace document → draft brief. Production should show timestamp, provider/model, inputs summary, redacted output, recorded/estimated cost, and errors. Never expose credentials or private chain-of-thought.</p></details></article><aside class="detail-aside"><section><h2 style="font-size:13px;margin-bottom:22px">Run details</h2><dl class="details-list"><div><dt>Owner</dt><dd>Research agent</dd></div><div><dt>AI cost</dt><dd>$0.38 · Recorded example</dd></div><div><dt>Budget</dt><dd>$2.00 for this run</dd></div><div><dt>Authority</dt><dd>Research only · No outreach</dd></div><div><dt>Context</dt><dd>Pilot scope, onboarding notes</dd></div><div><dt>External actions</dt><dd>None taken</dd></div></dl></section><div class="notice green">${state.run==='running'?'You can cancel this run at any time. Previously completed actions stay in the record.':'Cancellation stops future work; it does not undo completed external actions.'}</div></aside></div>`}
function agents(){return `${heading('A team with clear boundaries.','Choose who works on what. Keep their authority visible.')}${[['Chief of Staff','Coordinates plans and routes work to the right agent.','agents',''],['Research','Finds context and prepares sourced briefs.','search','blue'],['Growth','Drafts outreach. Asks before contacting anyone.','mail','amber'],['Operations','Builds the repeatable processes behind the work.','work','']].map(([name,desc,ic,tone])=>`<div class="work-row" style="align-items:center"><span class="agent-avatar ${tone}">${icon(ic,17)}</span><div class="grow"><h2 class="work-title">${name}</h2><p class="work-sub">${desc}</p></div>${badge('Supervised')}</div>`).join('')}<p class="small muted" style="margin-top:22px">The production Team detail adds tools, instructions, enabled state and autonomy. These example roles do not imply human employees.</p>`}
function knowledge(){return `${heading('Context that stays with the company.','Documents and memory your team can use, with provenance visible.')}<div class="tabs"><button class="tab active">Documents</button><button class="tab" data-action="knowledge-memory">Memory & graph</button></div>${[['Pilot scope','Workspace document · Updated today'],['Founder onboarding notes','Workspace document · Updated yesterday']].map(([a,b])=>`<button class="work-row" data-action="knowledge-doc"><span class="agent-avatar">${icon('file',17)}</span><span class="grow"><span class="work-title" style="display:block">${a}</span><span class="work-sub">${b}</span></span>${icon('chevron',15)}</button>`).join('')}<div id="knowledge-note" hidden class="preview prose" style="margin-top:20px"></div>`}
function tools(){return `${heading('Connect only what your team needs.','See account scope and permissions before an agent gets access.')}<div class="blank">${icon('tools',26)}<h2 style="margin-top:15px">No tools connected in this example.</h2><p>In production, choose an integration, review its permissions, and connect the correct account. Connections stay scoped to your organization.</p><button class="btn primary" data-action="tool-preview">Preview connection details ${icon('arrow',14)}</button></div><div id="tool-details" hidden class="preview prose" style="margin-top:20px"><h3>GitHub connection · Design preview</h3><p>Account: not connected. Permissions must be supplied by the live provider authorization screen. No connection is made by this prototype.</p><p>Implementation: show the connected account, repository scope, last verified status, revoke action and which agents may use it.</p></div>`}
function settings(){return `${heading('Autonomy, on your terms.','Budgets and permissions are controls, not fine print.')}<section class="detail-section"><h2>Supervised · Level 1</h2><p class="prose">Your team can prepare work and research. External actions require your approval. Actual permissions continue to be enforced by Steward’s policy engine.</p></section><section class="detail-section"><h2>AI spending limit</h2><p class="prose">Example company: $25.00 per month. When the budget is reached, show the waiting state and a permitted recovery action. Do not present an estimated cost as final.</p></section><section class="detail-section"><h2>All workspace destinations</h2><p class="prose">The shorter sidebar does not remove capabilities. Work contains tasks, projects, runs, activity and workflows. Knowledge contains documents and graph. Tools contains integrations and MCP. Business contains Growth, Finance and Website. Code and Browser stay linked from relevant work, with direct routes preserved.</p></section><div class="notice">Settings are read-only in this design prototype. No live authority or budget is changed.</div>`}
function delegate(){return `${heading('Give your team a clear outcome.','A task starts with a goal and boundaries, not a blank chat.')}<form id="delegate-form" style="max-width:650px"><div class="form-field"><label for="task-goal">What should be accomplished?</label><textarea id="task-goal" class="input" required maxlength="1000" placeholder="Research three possible pilot workflows and recommend where to start."></textarea></div><div class="form-field"><label for="task-context">Constraints <span class="muted">(optional)</span></label><textarea id="task-context" class="input" maxlength="1000" placeholder="Use our workspace notes. Do not contact anyone."></textarea></div><div class="notice green" style="margin-top:22px">Chief of Staff · Supervised. External actions still need approval. In production, confirm the budget before starting.</div><div class="decision-actions"><button class="btn primary" type="submit">Create example task ${icon('arrow',14)}</button><button type="button" class="btn ghost" data-route="overview">Cancel</button></div><p class="small muted" style="font-size:11px;margin-top:14px">Prototype only. No agent starts, no text is saved, and no API is called.</p></form>`}
function publicNav(){return `<header class="public-nav">${logo}<nav class="public-links" aria-label="Public pages"><a href="#website" class="hide-mobile">How it works</a><a href="#pilot">Assisted pilot</a><a href="#waitlist" class="btn">Request access ${icon('arrow',13)}</a></nav></header>`}
function footer(){return `<footer class="footer"><span>© 2026 Steward</span><nav><a href="#pilot">Assisted pilot</a><a href="#waitlist">Request access</a><a href="https://steward-eosin.vercel.app/legal/terms" target="_blank" rel="noopener">Terms</a><a href="https://steward-eosin.vercel.app/legal/privacy" target="_blank" rel="noopener">Privacy</a><a href="https://steward-eosin.vercel.app/login" target="_blank" rel="noopener">Sign in</a></nav></footer>`}
function scene(){return `<div class="product-scene" aria-label="Illustrative Steward workspace, not a live run"><div class="scene-top"><span class="row" style="gap:7px">${mark}<strong>Acme Labs</strong></span><span class="badge green">Supervised</span></div><div class="scene-body"><h2>A little less on your plate.</h2><p>One decision. A team ready for what’s next.</p><div class="scene-decision">${badge('Needs your approval','amber')}<h3>Send the pilot invitation?</h3><p>Your Growth agent has a draft ready. You decide what leaves the workspace.</p><button class="btn primary" style="margin-top:17px;min-height:36px;font-size:11px" data-route="approvals">Review invitation ${icon('arrow',12)}</button></div><div class="scene-track"><div class="scene-event"><span class="state-icon" style="width:20px;height:20px">${icon('check',11)}</span><span>Onboarding guide drafted</span><time>10:46</time></div><div class="scene-event"><span class="state-icon running" style="width:20px;height:20px">${icon('clock',11)}</span><span>Pilot research in progress</span><time>Now</time></div></div></div><div class="scene-foot">Illustration · Fictional workspace, not a live run</div></div>`}
function website(){return `${publicNav()}<main id="main" class="public-wrap" tabindex="-1"><section class="hero"><div><h1>A small team.<br><span>A bigger company.</span></h1><p>Give AI agents the work. Keep the decisions that matter. Steward brings your team, workflows, approvals and spending into one calm workspace.</p><div class="hero-actions">${button('Request early access','waitlist','primary')}${button('Explore the workspace','overview')}</div><p class="hero-footnote">Invite-only beta. Your model keys. Your limits.</p></div>${scene()}</section><div class="principle-strip"><span>${icon('shield')}Approve external actions</span><span>${icon('work')}Inspect every run</span><span>${icon('tools')}Bring your own model key</span><span>${icon('stop')}Cancel work in progress</span></div><section class="story"><h2>Less supervising.<br>More knowing.</h2><div><p><strong>Start with an outcome.</strong> Tell your Chief of Staff what needs doing and the limits to work within. Agents carry the work forward as durable workflows.</p><p><strong>Step in where it matters.</strong> Review a draft, approve an external action, or cancel a run. Open the record to see the evidence and cost behind it.</p><p>Not a black box. Not another place to watch a chatbot type.</p></div></section><section class="public-cta"><div><h2>Your first workflow, together.</h2><p>A $49 assisted pilot. One workspace, one guided setup, no subscription.</p></div>${button('Explore the pilot','pilot','primary')}</section>${footer()}</main>`}
function pilot(){return `${publicNav()}<main id="main" class="public-wrap" tabindex="-1"><section class="pilot-layout"><div class="pilot-copy"><span class="badge green">Invite-only beta</span><h1>Start small.<br>Get real work moving.</h1><p>The Steward assisted pilot helps you set up your first workspace and configure one workflow, with hands-on onboarding from our team.</p>${[['1','Request an invitation','Join the free waitlist. We invite teams as capacity opens up; joining does not reserve a spot.'],['2','Arrange your setup','If invited, arrange onboarding for one Steward workspace. Bring your own model key.'],['3','Run your first workflow','Configure one workflow together and learn how to review approvals, budgets and the run record.']].map(([n,t,d])=>`<div class="pilot-step"><span class="step-number">${n}</span><div><h2>${t}</h2><p>${d}</p></div></div>`).join('')}</div><aside class="price-panel"><h2>Assisted pilot</h2><div class="price num">$49 <small>USD / one time</small></div><p>No subscription. No automatic renewal.</p><ul class="price-list">${['One Steward workspace','Hands-on onboarding','Help configuring one workflow','Walkthrough of approvals and budgets'].map(t=>`<li>${icon('check',16)}${t}</li>`).join('')}</ul>${button('Join the free waitlist','waitlist','primary')}<p>The pilot is not open for payment in this concept. Joining does not guarantee an invitation.</p><p style="padding-top:14px">Your provider bills model usage separately. If payment opens, checkout goes to Stripe; payment does not create a Steward account.</p></aside></section>${footer()}</main>`}
function waitlist(){let card;if(state.waitlistMode==='unavailable'){card=`<section class="waitlist-card"><h2>The waitlist is temporarily unavailable.</h2><p>Please check back later. The pilot remains by invitation only; we haven’t saved your details.</p>${button('Back to the pilot','pilot')}<button class="btn ghost" data-action="waitlist-available">Reset example</button></section>`}else if(state.waitlist==='success'){card=`<section class="waitlist-card"><span class="agent-avatar" style="margin-bottom:20px">${icon('check',18)}</span><h2>You’re on the example list.</h2><p>This prototype simulated a successful submission. No information was sent or stored.</p><div class="notice green" style="margin-top:23px">Production confirmation: If a spot opens for you, we’ll send an invitation to your email. No account has been created yet.</div>${button('Back to the pilot','pilot')}<button class="btn ghost" data-action="reset-waitlist">Reset form</button></section>`}else{card=`<form id="waitlist-form" class="waitlist-card"><h2>Request a pilot invitation.</h2><p>Joining is free. It does not create an account or guarantee an invitation.</p><div class="form-field"><label for="email">Work email</label><input class="input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com"></div><div class="form-field"><label for="name">Your name <span class="muted">(optional)</span></label><input class="input" id="name" name="name" maxlength="120" autocomplete="name" placeholder="Your name"></div><div class="form-field"><label for="note">What would you like help with? <span class="muted">(optional)</span></label><textarea class="input" id="note" name="note" rows="3" maxlength="500" placeholder="Tell us about your first workflow."></textarea></div><p id="waitlist-error" class="form-error" role="alert" hidden>We couldn’t join the waitlist. Your details are still here. Please try again.</p><button class="btn primary" type="submit">Join the free waitlist ${icon('arrow',14)}</button><p class="fine">Prototype only: no information is sent or stored.<br>Production form links to <a href="https://steward-eosin.vercel.app/legal/privacy" target="_blank" rel="noopener">Steward’s privacy notice</a>.</p><div class="row wrap" style="gap:15px;margin-top:16px"><button type="button" class="text-link" data-action="waitlist-error" style="font-size:11px">Preview error</button><button type="button" class="text-link" data-action="waitlist-unavailable" style="font-size:11px">Preview unavailable</button></div></form>`}return `${publicNav()}<main id="main" class="public-wrap" tabindex="-1"><section class="waitlist-layout"><div class="waitlist-story"><h1>Make room for<br>what’s next.</h1><p>Start with one useful workflow and a team you can supervise. We’ll help you find the right first step.</p><blockquote>“Research the opportunity.<br>Show me the evidence.<br>Ask before reaching out.”</blockquote><p class="small" style="font-size:11px;margin-top:12px">Illustrative task, not a customer testimonial.</p></div>${card}</section>${footer()}</main>`}
function direction(){return `<main id="main" class="guide" tabindex="-1"><h1>Quiet momentum.</h1><p>A complete visual reset for an AI company workspace. More precise than playful. More human than a terminal. The signature is a continuous-path S mark, forest-green actions, generous white space and a sharply prioritized decision queue—not paper forms, glass, neon or decorative dashboards.</p><h2>Decisions first. Evidence one click away.</h2><p>The primary user is a founder checking what needs judgment, what is moving, and whether work remains inside its boundaries. The first screen leads with one approval, followed by active work. Chat is an input method, not the whole product. A run keeps its work product, history, cost and cancellation together.</p><h2>One identity, two working conditions.</h2><p>Light is the first-use default for daytime business work. Dark is an equal token set for extended sessions, not an assumed category aesthetic. Public pages share typography, green actions, the mark and quiet surfaces. The top study bar is prototype navigation and must not ship.</p><div class="swatches">${[['#ffffff','Canvas / white'],['#f7f8f7','Navigation / fog'],['#19271f','Text / pine ink'],['#245c41','Action / forest'],['#e7f1ea','Selected / pale sage'],['#855513','Decision / amber']].map(([c,t])=>`<div class="swatch"><div style="background:${c}"></div><p>${t}<br>${c}</p></div>`).join('')}</div><h2>What is actually current?</h2><ul><li><a href="https://linear.app/now/behind-the-latest-design-refresh" target="_blank" rel="noopener">Linear, March 2026:</a> dimmer navigation, consistent headers and less competing visual weight.</li><li><a href="https://www.notion.com/releases/2026-03-26" target="_blank" rel="noopener">Notion, March 2026:</a> a reorganized sidebar explicitly built to reduce crowding.</li><li><a href="https://www.notion.com/releases/2026-10-19" target="_blank" rel="noopener">Notion, October 2026:</a> BYOK and agent cost/governance visibility; distinguish live features from its announced, coming-soon Command Center.</li><li><a href="https://linear.app/now/mobile-diffs" target="_blank" rel="noopener">Linear, November 2026:</a> review, context and action together on mobile.</li><li><a href="https://microsoft.design/articles/ux-design-for-agents/" target="_blank" rel="noopener">Microsoft Design:</a> visible agent status, familiar UI, transparency and user control.</li><li><a href="https://www.nngroup.com/articles/designing-ai-agents/" target="_blank" rel="noopener">Nielsen Norman Group, May 2026:</a> familiar patterns and explicit data boundaries. A six-person consumer study, not proof about Steward customers.</li><li><a href="https://www.nngroup.com/articles/liquid-glass/" target="_blank" rel="noopener">Nielsen Norman Group on Liquid Glass:</a> trending does not establish usability. Opaque surfaces win for this decision-heavy workspace.</li></ul><p>This is a directional sample of primary product/design sources and published usability guidance, not market-share data or proof of what all users prefer. The full companion research lists sources, trade-offs, all existing routes, state requirements and build acceptance criteria.</p><h2>Try the important paths.</h2><ul><li>Workspace → Review invitation → approve or decline → decision recorded.</li><li>Work → open a run → inspect the artifact → cancel the example run.</li><li>Delegate work → enter a goal → create a local example task.</li><li>Website → $49 pilot → free waitlist → local confirmation, error or unavailable.</li><li>Switch theme, use Ctrl/Cmd+K, or narrow the viewport to review mobile.</li></ul><h2>Handoff, not a deployment.</h2><p>All data is fictional. There are no API calls, accounts, payments, saved form details, email sends or agent execution. The CTO should implement the new shell and decision loop first using existing APIs and policy enforcement, then migrate the remaining surfaces in the supplied route map. Preserve the live payment-link gate and auth-config states; never replace them with this static example.</p></main>`}
function render(){const apps={overview,approvals,work,run,agents,knowledge,tools,settings,new:delegate};const publics={website,pilot,waitlist,direction};document.getElementById('root').innerHTML=apps[route]?appShell(apps[route]()):(publics[route]||overview)();document.querySelectorAll('.study nav [data-route]').forEach(b=>{const selected=b.dataset.route===route||(b.dataset.route==='overview'&&apps[route]);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.title=`Steward — ${pageTitles[route]||({website:'Website',pilot:'Assisted pilot',waitlist:'Waitlist',direction:'Design direction'})[route]} / Design prototype`;document.querySelector('[data-close="palette"]').innerHTML=icon('close');updateThemeButton();}
function setRoute(){const next=location.hash.slice(1);route=['overview','approvals','work','run','agents','knowledge','tools','settings','new','website','pilot','waitlist','direction'].includes(next)?next:'overview';state.menu=false;render();window.scrollTo(0,0);document.getElementById('main')?.focus({preventScroll:true})}
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';const b=document.getElementById('theme-toggle');b.innerHTML=icon(dark?'sun':'moon',13)+(dark?'Light':'Dark');b.setAttribute('aria-label',`Switch to ${dark?'light':'dark'} theme`)}
function paletteResults(query=''){const entries=[...navItems,['run','clock','Run detail'],['new','plus','Delegate work'],['settings','settings','Settings'],['website','globe','Public website'],['pilot','work','Assisted pilot'],['waitlist','mail','Waitlist']].filter(([, ,label])=>label.toLowerCase().includes(query.toLowerCase()));document.getElementById('palette-results').innerHTML=entries.length?entries.map(([id,ic,label])=>`<button data-route="${id}">${icon(ic,16)}${label}</button>`).join(''):'<p class="small muted" style="padding:14px">No pages found. Try “work” or “pilot”.</p>'}
function showSearch(){paletteResults();document.getElementById('palette').showModal();document.getElementById('palette-search').value='';document.getElementById('palette-search').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){document.getElementById('palette').close();navigate(b.dataset.route)}if(b.dataset.close)document.getElementById(b.dataset.close).close();if(b.dataset.workTab){state.workTab=b.dataset.workTab;render()}switch(b.dataset.action){case'menu':state.menu=!state.menu;render();break;case'search':showSearch();break;case'approve':state.approval='approved';render();document.getElementById('main').focus();toast('Example decision recorded. No email sent.');break;case'decline':state.approval='declined';render();document.getElementById('main').focus();toast('Example invitation declined.');break;case'reset-approval':state.approval='pending';render();break;case'cancel-run':state.run='cancelled';render();toast('Example run cancelled. No live run was changed.');break;case'reset-run':state.run='running';render();break;case'artifact':state.draft=!state.draft;render();break;case'reset-waitlist':state.waitlist='form';render();break;case'waitlist-error':document.getElementById('waitlist-error').hidden=false;break;case'waitlist-unavailable':state.waitlistMode='unavailable';render();break;case'waitlist-available':state.waitlistMode='available';state.waitlist='form';render();break;case'tool-preview':document.getElementById('tool-details').hidden=false;break;case'knowledge-memory':document.getElementById('knowledge-note').hidden=false;document.getElementById('knowledge-note').textContent='Memory and graph share one Knowledge destination. Production must show sources, timestamps, access scope and deletion controls. No graph data is loaded in this prototype.';break;case'knowledge-doc':document.getElementById('knowledge-note').hidden=false;document.getElementById('knowledge-note').textContent='Example workspace document: configure one bounded research workflow. External actions require approval. This is fictional context, not a real company document.';break}});
document.addEventListener('submit',e=>{if(e.target.id==='waitlist-form'){e.preventDefault();state.waitlist='success';render();document.getElementById('main').focus()}if(e.target.id==='delegate-form'){e.preventDefault();state.newTask=true;navigate('work');toast('Local example task created. No agent started.')}});
document.getElementById('theme-toggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';updateThemeButton()});
document.getElementById('palette-search').addEventListener('input',e=>paletteResults(e.target.value));
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const main=document.getElementById('main');main?.focus();main?.scrollIntoView({block:'start'})});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}if(e.key==='Escape'&&state.menu){state.menu=false;render()}});
if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.dataset.theme='dark';
window.addEventListener('hashchange',setRoute);setRoute();
</script>
</body></html>
