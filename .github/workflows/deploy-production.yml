name: Deploy to production

# A merge to main is a release nobody has to remember to make, in whichever of two ways the project can
# currently move:
#
#   verify   Vercel's own Git connection builds each push (project Settings → Git → Connect Git Repository,
#            Production Branch main). Nothing here deploys; this waits for production to serve the pushed
#            commit and fails if it never does.
#   create   There is no connection, so a deployment has to be asked for by API for that exact commit.
#            Needs one repository secret, VERCEL_TOKEN (`gh secret set VERCEL_TOKEN`); without it the step
#            warns and names the command rather than failing for a capability nobody has switched on.
#
# Which one runs is the repository variable DEPLOY_MODE (`create` when unset) — a setting rather than a code
# path, because that answer changes when a person connects the project, not when a commit lands.
#
# Both modes end in the same verification, and that is the part worth having: scripts/hosted-check.mjs asks
# the deployment itself which commit it is running and compares that with the commit that was pushed,
# retrying while Vercel builds. A merge that changes nothing a build reads (docs, workflows, scripts) passes
# on the first attempt — Vercel ignores those builds by design — and one that production never picks up fails
# the run in minutes, instead of being found by the daily check the next morning. The daily run stays
# single-shot; only this one waits.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit production should be serving; defaults to the tip of the chosen ref
        required: false

# One run at a time, in the order they landed: two deployments finishing in the other order would leave the
# assigned domain on the older commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy this commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Full history, not the default single commit: the verification compares the commit production
      # reports with this checkout, and a shallow clone cannot answer that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only while the project has no Git connection: ask Vercel for a deployment of this exact commit.
      - name: Create the deployment for this commit (DEPLOY_MODE=${{ vars.DEPLOY_MODE || 'create' }})
        if: vars.DEPLOY_MODE != 'verify'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
          REQUIRE_TOKEN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/deploy-production.mjs

      # No install and no build: the deployment is Vercel's to make. This waits for it to exist and be
      # serving this commit, and says what production was serving instead if it never does.
      - name: Wait for production to serve this commit
        env:
          SHA: ${{ inputs.sha || github.sha }}
          ATTEMPTS: "24"
        run: |
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if EXPECT="$SHA" node scripts/hosted-check.mjs; then
              echo "production is current for $SHA (attempt $attempt)"
              exit 0
            fi
            echo "::notice::retrying in 30s (attempt $attempt of $ATTEMPTS): production may still be building $SHA, or the failure above is a real one"
            sleep 30
          done
          echo "::error::production is still not current for $SHA after 12 minutes of waiting; the last report above says what it was serving instead"
          exit 1
