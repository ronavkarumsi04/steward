name: Deploy to production

# A merge to main is a release nobody has to remember to make, in whichever of two ways the project can
# currently move:
#
#   verify   Vercel's own Git connection builds each push (project Settings → Git → Connect Git Repository,
#            Production Branch main). Nothing here deploys; this waits for production to serve the pushed
#            commit and fails if it never does.
#   create   There is no connection, so a deployment has to be asked for by API for that exact commit.
#            Needs the repository secret VERCEL_TOKEN (`gh secret set VERCEL_TOKEN`).
#
# Which one runs is the repository variable DEPLOY_MODE (`create` when unset) — a setting rather than a code
# path, because that answer changes when a person connects the project, not when a commit lands.
#
# Both modes verify the web commit behind the production alias through Vercel (using VERCEL_TOKEN),
# and check public health and the API revision independently. Unchanged build inputs need no redeploy.
# Only this workflow retries while production catches up.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit production should be serving; defaults to the tip of the chosen ref
        required: false

# One run at a time, in the order they landed: two deployments finishing in the other order would leave the
# assigned domain on the older commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy this commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Full history lets the checker compare each deployed tree with the requested commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only while the project has no Git connection: ask Vercel for a deployment of this exact commit.
      - name: Create the deployment for this commit (DEPLOY_MODE=${{ vars.DEPLOY_MODE || 'create' }})
        if: vars.DEPLOY_MODE != 'verify'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
        run: node scripts/deploy-production.mjs

      # No install and no build: the deployment is Vercel's to make. This waits for it to exist and be
      # serving this commit, and says what production was serving instead if it never does.
      - name: Wait for a healthy, current production deployment
        env:
          SHA: ${{ inputs.sha || github.sha }}
          ATTEMPTS: "24"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REQUIRE_EXECUTIONS: ${{ vars.REQUIRE_EXECUTIONS || '0' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is required to verify the production alias's web revision"
            exit 1
          fi
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if EXPECT="$SHA" EXPECT_WEB="$SHA" node scripts/hosted-check.mjs; then
              echo "production is current for $SHA (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::notice::retrying production verification in 30s (attempt $attempt of $ATTEMPTS)"
              sleep 30
            fi
          done
          echo "::error::production verification failed for $SHA after $ATTEMPTS attempts; see the last check above"
          exit 1
