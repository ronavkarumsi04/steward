name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, boot verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure (Postgres, Redis, Temporal)
        run: |
          docker compose up -d postgres redis temporal
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format json postgres temporal | grep -c '"Health":"healthy"' || true)
            [ "$healthy" -ge 2 ] && break
            sleep 2
          done
          docker compose ps

      - name: Lint
        run: pnpm lint

      # The deploy path is a script rather than a package, so `pnpm test` never reaches it — and it is the
      # piece that decides whether a merge reaches production, which is not a thing to find out in production.
      # No install and no database needed: a stub fetch stands in for Vercel.
      - name: Deploy path tests
        run: node --test "scripts/*.test.mjs"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://steward:steward@localhost:5432/steward

      # Before the tests, not after: `@steward/browser` drives a real Chromium against a real page, and it skips
      # itself when there is no browser — so installing later would turn the only test of the actual browser into a
      # green no-op. The suite that claims "a page can be read" has to run with a page to read. Both packages pin
      # Playwright 1.63.0, so this one installation serves the browser tests and the web end-to-end suite.
      - name: Install Playwright browsers
        run: pnpm --filter @steward/web exec playwright install --with-deps chromium

      - name: Unit and integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://steward:steward@localhost:5432/steward

      - name: Boot verification (production build, crash recovery, golden path)
        run: SKIP_INSTALL=1 pnpm verify:boot
        env:
          CI: "true"

      - name: Upload boot logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-boot-artifacts
          path: |
            data/verify-boot/*.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: true
          tags: steward-${{ matrix.service }}:ci
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Verify worker container readiness and shutdown
        if: matrix.service == 'worker'
        run: |
          set -euo pipefail
          docker compose up -d postgres temporal
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format json postgres temporal | grep -c '"Health":"healthy"' || true)
            [ "$healthy" -ge 2 ] && break
            sleep 2
          done
          network=$(docker inspect "$(docker compose ps -q postgres)" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          docker run --rm --network "$network" -e DATABASE_URL=postgres://steward:steward@postgres:5432/steward \
            steward-worker:ci node packages/db/dist/migrate.js
          docker run -d --name worker-smoke --network "$network" \
            -e DATABASE_URL=postgres://steward:steward@postgres:5432/steward \
            -e STEWARD_MASTER_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e SESSION_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -e TEMPORAL_ADDRESS=temporal:7233 -e TEMPORAL_TASK_QUEUE=worker-image-smoke \
            -e TEMPORAL_DISABLED=false -e RUN_MIGRATIONS_ON_START=false \
            -e BROWSER_PROVIDER=none -e SANDBOX_PROVIDER=none steward-worker:ci
          for i in $(seq 1 60); do
            docker exec worker-smoke node -e "fetch('http://127.0.0.1:4340/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker exec worker-smoke node -e "fetch('http://127.0.0.1:4340/ready').then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
          [ "$(docker exec worker-smoke id -u)" = "1000" ]
          docker exec worker-smoke test ! -e /var/run/docker.sock
          docker stop --time 45 worker-smoke
          [ "$(docker inspect worker-smoke --format '{{.State.ExitCode}}')" = "0" ]
          if docker run --rm -e TEMPORAL_DISABLED=true steward-worker:ci >disabled-worker.log 2>&1; then
            echo 'Disabled worker incorrectly exited successfully'
            exit 1
          fi
          grep -q 'A worker requires Temporal' disabled-worker.log

      - name: Worker container logs
        if: failure() && matrix.service == 'worker'
        run: docker logs worker-smoke || true
