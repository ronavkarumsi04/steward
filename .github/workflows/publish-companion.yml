name: Publish companion

on:
  workflow_dispatch:
  push:
    tags: ["companion-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/companion/package.json').version")
          test "$GITHUB_REF_NAME" = "companion-v$version"
      - run: pnpm install --frozen-lockfile --filter @steward/companion...
      - run: pnpm --filter @steward/companion typecheck
      - run: pnpm --filter @steward/companion lint
      - run: pnpm --filter @steward/companion test
      - name: Pack and smoke-test
        working-directory: apps/companion
        run: |
          npm pack
          npm i -g --prefix "$RUNNER_TEMP/companion" ./steward-companion-*.tgz
          "$RUNNER_TEMP/companion/bin/steward-companion" --help
      - name: Publish
        working-directory: apps/companion
        run: npm publish ./steward-companion-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
